<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}</style>
<script type="importmap">{"imports":{"three":"../vendor/three/build/three.module.js","three/addons/":"../vendor/three/examples/jsm/"}}</script>
</head><body><pre id="log" style="position:absolute;color:#fff;font:12px monospace;z-index:9;top:0;left:0"></pre>
<script type="module">
import * as THREE from 'three';
import { OutlineEffect } from 'three/addons/effects/OutlineEffect.js';
import { makeRng, hashSeed, billboard } from '../src/toolkit.js';
import { makeHazard } from '../src/hazards.js';
import { THEMES } from '../src/themes/index.js';
const log = (s) => { document.getElementById('log').textContent += s + '\n'; };
window.onerror = (m, s, l) => log('ERR ' + m + ' ' + l);
try {
const q = new URLSearchParams(location.search);
const th = THEMES[q.get('theme') || 'datacenter'];
const mode = q.get('mode') || 'road';
const secs = { datacenter: 37.57, 'datacenter-fire': 109.6, takeoff: 141.224 };
const sec = { id: 'sx', start: secs[th.id] };
globalThis.GAME = { pDoom: +(q.get('p') || 0.87) };
const W = 1280, H = 720;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H); document.body.appendChild(renderer.domElement);
const fx = new OutlineEffect(renderer, { defaultThickness: 0.004 });
const scene = new THREE.Scene();
const P = th.palette;
scene.background = new THREE.Color(P.skyBottom);
scene.fog = new THREE.Fog(P.skyBottom, 70, 230);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444466, 1.6));
const dl = new THREE.DirectionalLight(0xffffff, 2.2); dl.position.set(5, 10, 6); scene.add(dl);
const road = new THREE.Mesh(new THREE.PlaneGeometry(14, 600), new THREE.MeshLambertMaterial({ color: P.road }));
road.rotation.x = -Math.PI / 2; road.position.set(0, 0.01, -280); scene.add(road);
const gr = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshLambertMaterial({ color: P.ground }));
gr.rotation.x = -Math.PI / 2; gr.position.set(0, -0.1, -280); scene.add(gr);
for (const s of [-1, 1]) { const k = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 600), new THREE.MeshLambertMaterial({ color: P.kerb })); k.rotation.x = -Math.PI / 2; k.position.set(s * 7.55, 0.05, -280); scene.add(k); }
// sky gradient sphere
const sky = new THREE.Mesh(new THREE.SphereGeometry(500, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide, fog: false, depthWrite: false,
  uniforms: { top: { value: new THREE.Color(P.skyTop) }, bottom: { value: new THREE.Color(P.skyBottom) } },
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);} ',
  fragmentShader: 'uniform vec3 top; uniform vec3 bottom; varying vec3 vP; void main(){ float h=clamp(vP.y*1.6+0.15,0.,1.); gl_FragColor=vec4(mix(bottom,top,smoothstep(0.,1.,h)),1.);}' }));
sky.material.userData.outlineParameters = { visible: false };
scene.add(sky);
const active = [];
const t0 = sec.start + +(q.get('dt') || 1);
const kartZ = t0 * 30;
let count = 0;
if (mode === 'road') {
  const sp = th.spacing || 10;
  for (let zf = kartZ - 20; zf < kartZ + 230; zf += sp) {
    const rng = makeRng(hashSeed(sec.id, Math.round(zf)));
    for (const p of th.layout(zf, rng, sec)) {
      const o = th.makeProp(p.kind); if (!o) { log('no prop ' + p.kind); continue; }
      const z = zf + (p.dz || 0);
      o.position.set(p.x || 0, p.y || 0, -(z - kartZ)); o.rotation.y = p.rotY || 0; scene.add(o);
      active.push({ obj: o, kind: p.kind, zf: z, seed: (z * 13.37) % 1 });
      count++;
    }
  }
  th.billboards.forEach((b, i) => { const s = i % 2 ? -1 : 1; const o = billboard(b, th.billboardStyle || {}); o.position.set(s * 13.5, 0, -(30 + i * 45)); o.rotation.y = -s * 0.35; scene.add(o); });
  th.hazards.forEach((h, i) => { const o = makeHazard(h); o.scale.setScalar(1.2); o.position.set(i ? 3 : -3, 0, -(18 + i * 10)); scene.add(o); });
} else {
  // gallery: each kind in a row
  const kinds = [...new Set(Array.from({ length: 400 }, (_, i) => th.layout(sec.start * 30 + i * 10, makeRng(i + 1), sec).map((p) => p.kind)).flat())];
  log('kinds: ' + kinds.join(','));
  kinds.forEach((k, i) => { const o = th.makeProp(k); o.position.set(0, 0, 0); o.position.set((i - (kinds.length - 1) / 2) * (kinds.length > 6 ? 9 : 12), 0, k.match(/gantry|banner|scoreboard/) ? -25 : 0); o.rotation.y = 0; scene.add(o); active.push({ obj: o, kind: k, zf: kartZ + 200, seed: i * 0.13 }); });
}
log(th.id + ' props: ' + count);
const cam = new THREE.PerspectiveCamera(70, W / H, 0.1, 1000);
if (mode === 'road') { cam.position.set(0, 3.5, 7); cam.lookAt(0, 2.5, -30); }
else { cam.position.set(0, 7, 34); cam.lookAt(0, 6, 0); cam.fov = 75; cam.updateProjectionMatrix(); }
let t = t0 + +(q.get('adv') || 0);
for (const a of active) th.animate?.(a.obj, a.kind, t, 0.2, a);
fx.render(scene, cam);
log('tris ' + renderer.info.render.triangles + ' calls ' + renderer.info.render.calls);
} catch (e) { log('EXC ' + e.stack); }
</script></body></html>
