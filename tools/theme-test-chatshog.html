<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;overflow:hidden;background:#000}</style>
<script type="importmap">{"imports":{"three":"./../vendor/three/build/three.module.js","three/addons/":"./../vendor/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { OutlineEffect } from 'three/addons/effects/OutlineEffect.js';
import { makeRng, hashSeed } from '../src/toolkit.js';
import chatbot, { sydney } from '../src/themes/chatbot.js';
import shoggoth from '../src/themes/shoggoth.js';
import { billboard } from '../src/toolkit.js';
const Q = new URLSearchParams(location.search);
const TH = { chatbot, sydney, shoggoth }[Q.get('theme') || 'chatbot'];
const mode = Q.get('mode') || 'road';
const T = +(Q.get('t') || 1.3), BEAT = +(Q.get('beat') || 0.15);
const r = new THREE.WebGLRenderer({ antialias: true });
r.setSize(1280, 720); r.setPixelRatio(1);
document.body.appendChild(r.domElement);
const fx = new OutlineEffect(r, { defaultThickness: 0.004 });
const scene = new THREE.Scene();
const P = TH.palette;
scene.background = new THREE.Color(P.skyBottom);
scene.fog = new THREE.Fog(P.skyBottom, 30, 230);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8877aa, TH.night ? 1.0 : 1.6));
const dl = new THREE.DirectionalLight(0xffffff, TH.night ? 1.2 : 2.0); dl.position.set(5, 10, 6); scene.add(dl);
const flat = (w, d, c, x, y, z) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshToonMaterial({ color: c })); m.rotation.x = -Math.PI/2; m.position.set(x, y, z); m.material.userData.outlineParameters={visible:false}; scene.add(m); };
flat(600, 600, P.ground, 0, -0.15, -250); flat(14, 600, P.road, 0, 0, -250);
flat(1.1, 600, P.kerb, -7.55, 0.02, -250); flat(1.1, 600, P.kerb, 7.55, 0.02, -250);
const objs = [];
const cam = new THREE.PerspectiveCamera(70, 1280/720, 0.1, 1000);
if (mode === 'road') {
  const sec = { start: 0 };
  for (let zf = 10; zf < 240; zf += TH.spacing) {
    const rng = makeRng(hashSeed('s' + (Q.get('seed')||''), zf));
    for (const p of TH.layout(zf, rng, sec)) {
      const o = TH.makeProp(p.kind); if (!o) { console.log('missing', p.kind); continue; }
      o.position.set(p.x || 0, p.y || 0, -(zf + (p.dz || 0))); o.rotation.y = p.rotY || 0; o.scale.setScalar(p.scale || 1);
      scene.add(o); objs.push({ o, kind: p.kind, seed: (zf * 13.37) % 1 });
    }
  }
  [40, 110].forEach((zf, k) => { const s = k%2?-1:1; const b = billboard(TH.billboards[k], TH.billboardStyle); b.position.set(s*13.5, 0, -zf); b.rotation.y=-s*0.35; scene.add(b); });
  const cz = +(Q.get('cz') || 0);
  cam.position.set(+(Q.get('cx')||0), 3.5, 7 - cz); cam.lookAt(0, 2.2, -30 - cz);
} else {
  const kinds = Q.get('kinds').split(',');
  const cols = Math.ceil(Math.sqrt(kinds.length * 1.8)), sp = +(Q.get('sp') || 14);
  kinds.forEach((k, i) => {
    const o = TH.makeProp(k); if (!o) { console.log('missing', k); return; }
    const c = i % cols, row = Math.floor(i / cols);
    o.position.set((c - (cols - 1) / 2) * sp, 0, -row * sp * 1.2);
    scene.add(o); objs.push({ o, kind: k, seed: i * 0.13 });
  });
  cam.position.set(0, +(Q.get('cy')||9), +(Q.get('cd')||22)); cam.lookAt(0, 4, -8);
}
for (const { o, kind, seed } of objs) TH.animate && TH.animate(o, kind, T, BEAT, { seed });
let n = 0;
(function loop() { fx.render(scene, cam); if (++n < 5) requestAnimationFrame(loop); })();
</script></body></html>
